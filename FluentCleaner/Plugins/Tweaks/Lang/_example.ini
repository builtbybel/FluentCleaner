; Wording for rules, one file per language. Not loaded: the name must be a language code,
; such as de-DE.ini, de.ini, fr-FR.ini. A leading underscore can never match one, so this
; file is a template and nothing else.
;
; How it works
;   A section heading is the rule's own name, exactly as it stands in WinRules.ini.
;   Name   = the title shown in the list
;   Detail = the description shown under the list
;   Both are optional. Anything left out keeps the English text from the rule file, so a
;   half finished translation is fine and shows no gaps.
;
; Matching
;   de-DE.ini is tried first, then de.ini. An Austrian or Swiss install therefore gets the
;   German wording instead of falling back to English.
;
; Adding a language needs no code and no build: drop the file into Plugins\Tweaks\Lang\ and use
; Refresh in the [...] menu of the tweak page.
;
; Not translated here: the category names. Those come from the Where_* keys in
; Strings\<language>\Resources.resw, because the app shows them in its own filter as well.

[Disable File Explorer Ads]
Name=Explorer-Werbung abschalten
Detail=Schaltet die Hinweise von Synchronisierungsanbietern (OneDrive-Werbung) in der Statusleiste des Explorers ab.

[Disable Lock Screen Ads]
Name=Werbung im Sperrbildschirm abschalten
Detail=Entfernt die Windows-Spotlight-Werbung und ihre Einblendung vom Sperrbildschirm.
