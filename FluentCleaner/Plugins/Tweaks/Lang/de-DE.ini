; Deutsche Beschriftung der Regeln aus ..\WinRules.ini.
; Abschnittsname = Regelname im Katalog. Name = Titel in der Liste, Detail = Beschreibung.
; Fehlt ein Eintrag, bleibt der englische Text aus der Regeldatei stehen.
; Die Kategorien stehen nicht hier, sondern als Where_* in Strings\de-DE\Resources.resw.

; ---------------------------------------------------------------- Werbung ----

[Disable File Explorer Ads]
Name=Werbung im Explorer abschalten
Detail=Schaltet die Hinweise von Synchronisierungsanbietern (OneDrive-Werbung) in der Statusleiste des Explorers ab.

[Disable Finish Setup Ads]
Name=Aufforderung "Setup abschließen" abschalten
Detail=Verhindert, dass Windows nach dem Anlegen eines Benutzerkontos weiter zur Einrichtung drängt und dabei Werbung zeigt.

[Disable Lock Screen Ads]
Name=Werbung im Sperrbildschirm abschalten
Detail=Entfernt die Windows-Spotlight-Werbung und ihre Einblendung vom Sperrbildschirm.

[Disable Personalized Ads]
Name=Personalisierte Werbung abschalten
Detail=Schaltet die Werbe-ID ab, mit der Apps dich über Programmgrenzen hinweg wiedererkennen.

[Disable Settings App Ads]
Name=Werbung in den Einstellungen abschalten
Detail=Entfernt die Vorschläge zu Microsoft-Konto, Office und weiteren Apps aus der Einstellungen-App.

[Disable Start Menu Ads]
Name=Werbung im Startmenü abschalten
Detail=Entfernt App-Empfehlungen und Werbung aus dem Startmenü (Windows 11).

[Disable Tailored Experiences]
Name=Maßgeschneiderte Erlebnisse abschalten
Detail=Verhindert, dass Microsoft aus den Diagnosedaten persönliche Tipps, Werbung und Empfehlungen ableitet.

[Disable Tips and Suggestions]
Name=Tipps und Vorschläge abschalten
Detail=Schaltet die Windows-Tipps ab, die im Sperrbildschirm und in den Benachrichtigungen auftauchen.

[Disable Welcome Experience Ads]
Name=Willkommensseite nach Updates abschalten
Detail=Verbirgt die Seite "Das ist neu", die Windows nach einem Update anzeigt.

; --------------------------------------------------------------------- KI ----

[Disable AI Service Autostart]
Name=Autostart des KI-Dienstes abschalten
Detail=Stellt den Windows-KI-Dienst auf Start bei Bedarf statt Start mit Windows. Funktionen, die ihn brauchen, starten ihn weiterhin selbst, er belegt nur nicht mehr ab dem Hochfahren Speicher.

[Disable Chrome AI Features]
Name=KI-Funktionen in Chrome abschalten
Detail=Schaltet die Gemini-Teile von Google Chrome über die von Google dokumentierten Richtlinien ab, einschließlich des lokalen Modells, der Verlaufssuche und der KI-Einträge in der Adresszeile.

[Disable Click To Do]
Name=Click To Do abschalten
Detail=Schaltet die Click-To-Do-Einblendung ab, die bei gehaltener Windows-Taste und einem Klick KI-Aktionen zum Bildschirminhalt anbietet. Markieren und Kopieren funktioniert wie zuvor.

[Disable Copilot on Taskbar]
Name=Copilot aus der Taskleiste entfernen
Detail=Entfernt die Copilot-Schaltfläche per Richtlinie aus der Taskleiste.

[Disable Edge AI Features]
Name=KI-Funktionen in Edge abschalten
Detail=Schaltet die Copilot-Teile von Microsoft Edge ab, darunter die Seiteninhalte, die der Browser an den Assistenten weitergeben würde, das Chat-Symbol, die KI-Verlaufssuche und das lokale Sprachmodell.

[Disable Notepad AI Features]
Name=KI-Funktionen im Editor abschalten
Detail=Entfernt die Copilot-Einträge aus dem Editor, sodass Umschreiben und Zusammenfassen keinen Text mehr verschicken.

[Disable Paint AI Features]
Name=KI-Funktionen in Paint abschalten
Detail=Entfernt Cocreator, Bildersteller, generatives Füllen, generatives Löschen und Hintergrund entfernen aus Paint. Alles andere bleibt, wie es ist.

[Disable Recall]
Name=Recall abschalten
Detail=Hält Recall auf einem Copilot+-PC ausgeschaltet. Recall fotografiert den Bildschirm im Abstand von Sekunden und macht ihn durchsuchbar. Das hier blockiert sowohl das Einschalten als auch die Auswertung dahinter.

[Disable Search Box Suggestions]
Name=Websuche im Suchfeld abschalten
Detail=Schaltet die Vorschläge aus dem Internet im Suchfeld des Startmenüs ab.

; ------------------------------------------------------------------- Edge ----

[Disable Edge Browser Sign-in]
Name=Anmeldeaufforderung in Edge abschalten
Detail=Verhindert, dass Microsoft Edge zur Anmeldung mit einem Microsoft-Konto auffordert.

[Disable Edge Default Top Sites]
Name=Vorgegebene Verknüpfungen in Edge entfernen
Detail=Verbirgt die vorinstallierten Verknüpfungen (etwa MSN oder Office) auf der Startseite neuer Edge-Tabs.

[Disable Edge Default Browser Prompt]
Name=Nachfrage zum Standardbrowser abschalten
Detail=Verhindert, dass Edge dich auffordert, es als Standardbrowser festzulegen.

[Disable Edge Collections]
Name=Sammlungen in Edge abschalten
Detail=Schaltet die Sammlungen-Funktion in Microsoft Edge ab.

[Disable Edge Shopping Assistant]
Name=Einkaufshilfe in Edge abschalten
Detail=Schaltet den Preisvergleich und die Einkaufsleiste in Edge ab.

[Disable Edge First Run Experience]
Name=Begrüßungsseite in Edge abschalten
Detail=Überspringt die Willkommensseite, die nach einer Neuinstallation oder einem Update von Edge erscheint.

[Disable Edge Gamer Mode]
Name=Spielemodus in Edge abschalten
Detail=Schaltet den Spielemodus in Microsoft Edge ab.

[Disable Edge Hubs Sidebar]
Name=Hubs-Seitenleiste in Edge entfernen
Detail=Entfernt die Seitenleiste mit Entdecken, Werkzeugen und dergleichen aus Microsoft Edge.

[Disable Edge Import on Launch]
Name=Importabfrage beim Start von Edge abschalten
Detail=Verhindert, dass Edge bei jedem Start nach dem Übernehmen von Daten fragt.

[Disable Edge Startup Boost]
Name=Schnellstart von Edge abschalten
Detail=Schaltet den Schnellstart ab, der Edge nach dem Schließen im Hintergrund weiterlaufen lässt.

[Disable Edge New Tab Quick Links]
Name=Schnellzugriff auf neuen Edge-Tabs entfernen
Detail=Verbirgt die Verknüpfungen für den Schnellzugriff auf der Startseite neuer Edge-Tabs.

[Disable Edge User Feedback]
Name=Feedback aus Edge abschalten
Detail=Verhindert, dass aus Edge heraus Rückmeldungen an Microsoft gesendet werden.

; --------------------------------------------------------------- Explorer ----

[Hide Drive Letters]
Name=Laufwerksbuchstaben ausblenden
Detail=Zeigt Laufwerksnamen ohne den Buchstaben davor, sodass unter Dieser PC nur noch Windows statt Windows (C:) steht. Überall, wo du einen Pfad eingibst, funktionieren die Buchstaben weiter.

[Hide Duplicate Removable Drives]
Name=Doppelte Wechsellaufwerke ausblenden
Detail=Entfernt den zweiten Eintrag, den ein USB-Stick im Navigationsbereich erhält, wo er unter Dieser PC ohnehin schon steht.

[Hide Gallery from Navigation Pane]
Name=Galerie aus dem Navigationsbereich entfernen
Detail=Nimmt den Eintrag Galerie aus dem Navigationsbereich. Deine Fotos bleiben, wo sie sind.

[Hide Home from Navigation Pane]
Name=Startseite aus dem Navigationsbereich entfernen
Detail=Nimmt den Eintrag Start aus dem Navigationsbereich, also den mit den zuletzt benutzten und empfohlenen Dateien.

[Hide OneDrive from Navigation Pane]
Name=OneDrive aus dem Navigationsbereich entfernen
Detail=Nimmt den Eintrag OneDrive aus dem Navigationsbereich. Es wird nichts getrennt und nichts gelöscht, der Ordner ist dort nur nicht mehr angeheftet.

[Open File Explorer in This PC]
Name=Explorer mit Dieser PC öffnen
Detail=Öffnet den Explorer mit Dieser PC statt mit Start, sodass die Laufwerke das Erste sind, was du siehst.

[Remove Give Access To from Context Menu]
Name="Zugriff gewähren auf" aus dem Kontextmenü entfernen
Detail=Entfernt das Freigabe-Untermenü aus dem Rechtsklickmenü von Dateien, Ordnern und Laufwerken. Freigeben selbst funktioniert weiterhin über die Eigenschaften.

[Remove Include in Library from Context Menu]
Name="In Bibliothek aufnehmen" aus dem Kontextmenü entfernen
Detail=Entfernt den Bibliothekseintrag aus dem Rechtsklickmenü von Ordnern. Die Bibliotheken selbst bleiben.

[Show File Extensions]
Name=Dateiendungen anzeigen
Detail=Zeigt den Dateityp am Ende jedes Namens. So erkennst du, dass eine rechnung.pdf.exe ein Programm ist.

[Show Hidden Files and Folders]
Name=Versteckte Dateien und Ordner anzeigen
Detail=Zeigt Dateien und Ordner, die Windows aus dem Blick nimmt. Systemdateien bleiben verborgen, dafür gibt es einen eigenen Schalter.

; ------------------------------------------------------------------ Spiele ---

[Disable Game Bar]
Name=Spieleleiste abschalten
Detail=Verhindert, dass sich die Spieleleiste bei Windows+G öffnet und beim Start eines Spiels begrüßt. Der Spielemodus selbst bleibt unberührt.

[Disable Game DVR]
Name=Hintergrundaufzeichnung abschalten
Detail=Schaltet die Hintergrundaufzeichnung von Xbox Game DVR ab, die Prozessorlast verursacht und die Leistung in Spielen kosten kann.

[Disable Power Throttling]
Name=Leistungsbegrenzung abschalten
Detail=Schaltet die Leistungsbegrenzung ab, sodass der Prozessor für alle Programme mit voller Geschwindigkeit arbeitet.

[Optimize Visual Effects for Performance]
Name=Visuelle Effekte auf Leistung trimmen
Detail=Schaltet die Animationen von Fenstern, Taskleiste und Vorschau ab, ebenso den Fensterinhalt beim Ziehen. Der Dialog Leistungsoptionen zeigt danach Benutzerdefiniert, weil es genau das ist.

; --------------------------------------------------------- Datenschutz -------

[Disable Activity History]
Name=Aktivitätsverlauf abschalten
Detail=Verhindert, dass Windows für die Zeitleiste mitschreibt, welche Apps geöffnet und welche Dateien benutzt wurden.

[Disable App Launch Tracking]
Name=Erfassung gestarteter Apps abschalten
Detail=Verhindert, dass Windows für die Vorschläge im Startmenü mitzählt, welche Apps du startest.

[Reduce Diagnostic Data]
Name=Diagnosedaten verringern
Detail=Begrenzt die Diagnose- und Telemetriedaten an Microsoft auf das niedrigste zulässige Maß.

[Disable Find My Device]
Name="Mein Gerät suchen" abschalten
Detail=Verhindert, dass Windows den Standort dieses Geräts meldet, damit es über ein Microsoft-Konto gefunden werden kann. Diesen Weg, einen gestohlenen Rechner zu orten, gibst du damit auf.

[Disable Location Tracking]
Name=Standortermittlung abschalten
Detail=Schaltet den Windows-Standortdienst für alle Apps auf diesem Gerät ab.

[Disable Lock Screen Slideshow]
Name=Diaschau im Sperrbildschirm abschalten
Detail=Schaltet die Diaschau im Sperrbildschirm ab, die auch persönliche Fotos zeigen kann.

[Disable Narrator Online Services]
Name=Online-Dienste der Sprachausgabe abschalten
Detail=Verhindert, dass die Windows-Sprachausgabe Daten an Microsoft-Onlinedienste schickt.

[Disable Notification Banners]
Name=Benachrichtigungsbanner abschalten
Detail=Unterdrückt die aufklappenden Banner von Apps und von Windows selbst. Das Benachrichtigungscenter sammelt sie weiter, es geht also nichts verloren, es unterbricht nur nicht mehr.

[Disable Online Speech Recognition]
Name=Online-Spracherkennung abschalten
Detail=Schaltet die Spracherkennung in der Cloud und die Personalisierung der Eingabe ab.

[Disable Silent App Installation]
Name=Stille App-Installation abschalten
Detail=Verhindert, dass Windows vorgeschlagene Apps unbemerkt im Hintergrund installiert.

[Disable Windows Spotlight Lock Screen]
Name=Windows-Spotlight im Sperrbildschirm abschalten
Detail=Schaltet Windows-Spotlight ab, das von Microsoft ausgewählte Bilder und Tipps im Sperrbildschirm zeigt.

; -------------------------------------------------------------- System -------

[Show BSOD Details]
Name=Details beim Bluescreen anzeigen
Detail=Zeigt im Bluescreen die technischen Angaben wie Stopcode und Parameter statt des Smileys.

[Enable Long Paths]
Name=Lange Pfade erlauben
Detail=Hebt die Grenze von 260 Zeichen für Programme auf, die lange Pfade in ihrem Manifest zusagen. Programme lesen den Wert beim Start einmal, erst ein Neustart wirkt also überall.

[Disable Hibernation]
Name=Ruhezustand abschalten
Detail=Schaltet den Ruhezustand ab. Damit verschwindet hiberfil.sys und es wird so viel Speicherplatz frei, wie der Rechner Arbeitsspeicher hat. Der Schnellstart benutzt dieselbe Datei und geht mit aus, der nächste Start ist also ein vollständiger.

[Reduce Menu Show Delay]
Name=Verzögerung bei Menüs verkürzen
Detail=Setzt die Wartezeit beim Aufklappen von Untermenüs auf 10 ms. Windows liefert 400 ms. Liegt dein Wert schon darunter, verlängert das Anwenden ihn.

[Disable Network Throttling]
Name=Netzwerkbegrenzung abschalten
Detail=Entfernt die Multimedia-Netzwerkbremse von Windows, die den Durchsatz für Aufgaben im Hintergrund begrenzen kann.

[Speed Up Shutdown]
Name=Herunterfahren beschleunigen
Detail=Verkürzt die Zeit, die Windows beim Herunterfahren auf das Beenden von Diensten wartet, von 5000 ms auf 1000 ms.

[Optimize Multimedia CPU Priority]
Name=Prozessorzeit für Multimedia erhöhen
Detail=Reserviert 10 Prozent der Prozessorzeit für Hintergrundaufgaben statt der üblichen 20, was Spielen und Multimedia mehr Luft lässt. Liegt dein Wert schon unter 10, senkt das Anwenden die Priorität.

[Show Verbose Status Messages]
Name=Ausführliche Statusmeldungen anzeigen
Detail=Zeigt beim Starten und Herunterfahren, was Windows gerade tut, statt nur "Bitte warten".

[Disable Automatic Device Encryption]
Name=Automatische Geräteverschlüsselung abschalten
Detail=Verhindert, dass Windows die Geräteverschlüsselung während der Einrichtung oder bei der ersten Anmeldung mit einem Microsoft-Konto von selbst einschaltet. Ein bereits verschlüsseltes Laufwerk bleibt verschlüsselt, das musst du selbst aufheben, wenn du es anders willst.

[Disable Enhance Pointer Precision]
Name=Zeigerbeschleunigung abschalten
Detail=Schaltet die Mausbeschleunigung ab, sodass dieselbe Handbewegung immer dieselbe Strecke auf dem Bildschirm zurücklegt. Die drei Werte gehören zusammen und Windows liest sie bei der Anmeldung.

[Disable Sticky Keys Shortcut]
Name=Tastenkombination für die Einrastfunktion abschalten
Detail=Verhindert, dass fünfmaliges Drücken der Umschalttaste die Einrastfunktion anbietet, also jene Abfrage, die Spiele und das Schreiben unterbricht. Die Einrastfunktion selbst bleibt über die Eingabehilfen erreichbar.

[Disable Storage Sense]
Name=Speicheroptimierung abschalten
Detail=Verhindert, dass die Speicheroptimierung den Papierkorb und den Downloads-Ordner nach eigenem Zeitplan leert. Das wird als Richtlinie geschrieben, der Schalter in den Einstellungen ist danach ausgegraut.

; ------------------------------------------------------------ Taskleiste ----

[Align Taskbar Left]
Name=Taskleiste links ausrichten
Detail=Rückt die Symbole der Taskleiste zurück an den linken Rand, wo sie bis Windows 10 standen. Das Standardprofil enthält dafür keinen Wert, das Zurücksetzen entfernt ihn also und überlässt Windows die Entscheidung.

[Always Show All Tray Icons]
Name=Alle Symbole im Infobereich anzeigen
Detail=Zeigt alle Symbole des Infobereichs, statt sie hinter dem Pfeil zu verstecken. (Nur Windows 10)

[Disable News and Interests]
Name="Neuigkeiten und interessante Themen" abschalten
Detail=Entfernt das Wetter- und Nachrichtenfeld aus der Taskleiste von Windows 10. (Nur Windows 10)

[Remove Meet Now Button]
Name="Jetzt besprechen" entfernen
Detail=Verbirgt die Schaltfläche für Videoanrufe im Infobereich. (Nur Windows 10)

[Hide Search from Taskbar]
Name=Suche aus der Taskleiste entfernen
Detail=Entfernt die Suche vollständig aus der Taskleiste, Feld und Symbol gleichermaßen. Die Suche öffnet weiterhin über das Startmenü oder mit Windows+S.

[Show Search Icon Only]
Name=Suche nur als Symbol anzeigen
Detail=Schrumpft das Suchfeld auf ein einzelnes Symbol. Das gibt der Taskleiste die Breite zurück, ohne die Suche ganz zu verbergen.

[Hide Task View Button]
Name=Schaltfläche für die Taskansicht entfernen
Detail=Entfernt die Schaltfläche für die Taskansicht aus der Taskleiste.

[Enable End Task on Taskbar]
Name="Task beenden" im Kontextmenü der Taskleiste
Detail=Ergänzt das Rechtsklickmenü der Taskleiste um "Task beenden", um ein Programm sofort abzubrechen. (Nur Windows 11)

[Use Small Taskbar Icons]
Name=Kleine Symbole in der Taskleiste
Detail=Verkleinert die Symbole der Taskleiste und macht sie damit flacher. (Nur Windows 10)

[Return to Last Active Window on Click]
Name=Klick öffnet das zuletzt benutzte Fenster
Detail=Ein Klick auf eine gruppierte Schaltfläche holt das Fenster zurück, das du zuletzt benutzt hast, statt die Vorschaureihe zu öffnen. Beim Zeigen erscheinen weiterhin alle Fenster der Gruppe.

; ------------------------------------------------------- Erscheinungsbild ----

[Disable Bing Search in Start Menu]
Name=Bing-Suche im Startmenü abschalten
Detail=Verhindert, dass das Startmenü eingegebene Suchbegriffe an Bing und ins Internet schickt.

[Enable Dark Mode]
Name=Dunkles Design einschalten
Detail=Stellt Windows und seine Apps auf das dunkle Farbschema. Das mitgelieferte Standarddesign setzt beides auf hell, und genau das stellt das Zurücksetzen wieder her.

[Enable Classic Context Menus]
Name=Klassische Kontextmenüs einschalten
Detail=Stellt in Windows 11 das vollständige Rechtsklickmenü im Stil von Windows 10 wieder her. (Nur Windows 11)

[Disable Lock Screen]
Name=Sperrbildschirm überspringen
Detail=Überspringt den Sperrbildschirm und geht beim Aufwachen direkt zur Anmeldung.

[Show Most Used Apps in Start Menu]
Name=Häufig verwendete Apps im Startmenü anzeigen
Detail=Hält die Liste der häufig verwendeten Apps im Startmenü dauerhaft sichtbar. Die Richtlinie kennt 1 für anzeigen und 2 für verbergen. Ohne sie entscheidet der Schalter in den Einstellungen.

[Disable Snap Layouts When Dragging]
Name=Layoutleiste beim Ziehen abschalten
Detail=Verhindert, dass die Layoutleiste herunterklappt, wenn du ein Fenster an den oberen Bildschirmrand ziehst. Das Ziehen in eine Ecke rastet weiterhin ein.

[Disable Snap Suggestions]
Name=Vorschläge beim Einrasten abschalten
Detail=Nach dem Einrasten eines Fensters bietet Windows die übrigen Fenster für die freie Bildschirmhälfte an. Das schaltet dieses Angebot ab. Die Layouts an der Maximieren-Schaltfläche sind eine eigene Einstellung.

[Disable Snap Assist Flyout]
Name=Layouts an der Maximieren-Schaltfläche abschalten
Detail=Schaltet die Layoutauswahl ab, die erscheint, wenn du auf die Maximieren-Schaltfläche zeigst.

[Hide Edge Tabs in Alt Tab]
Name=Edge-Tabs aus Alt+Tab entfernen
Detail=Beschränkt Alt+Tab auf offene Fenster und lässt die Browser-Tabs heraus, sodass sich die Auswahl nicht mehr mit Webseiten füllt.

[Disable Transparency Effects]
Name=Transparenzeffekte abschalten
Detail=Schaltet die durchscheinenden Flächen von Taskleiste, Startmenü und Fenstern ab. Die Oberflächen werden deckend, was den Fensterzeichner bei schwacher Grafik entlastet.

[Hide Settings Home Page]
Name=Startseite der Einstellungen ausblenden
Detail=Entfernt die Startseite aus der Einstellungen-App, sodass sie mit System öffnet und keine Empfehlungskarten zeigt. Dieser Wert ist eine Liste von Seiten, und das Anwenden ersetzt, was bisher darin stand.

[Set Start Menu to More Pins Layout]
Name=Startmenü mit mehr angehefteten Apps
Detail=Stellt das Startmenü von Windows 11 so ein, dass es mehr angeheftete Apps und weniger Empfehlungen zeigt.

[Disable Start Menu Phone Companion]
Name=Handy-Begleiter im Startmenü abschalten
Detail=Verbirgt die Handy-Leiste, die Windows 11 rechts im Startmenü öffnet. Das Ergebnis entspricht dem Schalter unter Einstellungen, Personalisierung, Start, Begleiter.

; ------------------------------------------------------------- Updates ------

[Keep Update Pause Available]
Name=Längeres Anhalten von Updates ermöglichen
Detail=Erhöht die Obergrenze, sodass die Einstellungen die langen Zeiträume zum Anhalten von Updates anbieten statt nur einer Woche.

[Never Restart While Signed In]
Name=Kein Neustart bei angemeldetem Benutzer
Detail=Verhindert, dass Windows von selbst neu startet, um ein Update abzuschließen, während noch jemand angemeldet ist.

[Download Updates But Ask Before Installing]
Name=Updates laden, aber vor dem Installieren fragen
Detail=Lädt Updates weiterhin herunter, wartet mit dem Installieren aber auf deinen Klick, statt nach eigenem Zeitplan zu installieren.

[Do Not Include Drivers in Updates]
Name=Keine Treiber über Windows Update
Detail=Lässt Treiber aus Windows Update heraus, sodass ein funktionierender Treiber nicht hinter deinem Rücken ersetzt wird.

[Do Not Restart Devices Automatically]
Name=Keinen Neustart automatisch einplanen
Detail=Blockiert den automatischen Neustart, den Windows nach einem Update außerhalb der Nutzungszeit einplant.

[Do Not Install Updates Early]
Name=Updates nicht vorab installieren
Detail=Schaltet "Neueste Updates erhalten, sobald sie verfügbar sind" ab, sodass dieser Rechner auf die reguläre Verteilung wartet statt zur ersten Welle zu gehören.

[Download Updates Only From Microsoft]
Name=Updates nur von Microsoft laden
Detail=Stellt die Übermittlungsoptimierung auf Microsoft-Server um, sodass dieser Rechner weder Updateteile von anderen Rechnern holt noch an sie abgibt.

[Do Not Download Device Icons and Info]
Name=Keine Gerätesymbole und -infos laden
Detail=Verhindert, dass Windows für neu angeschlossene Hardware Symbole, Namen und App-Vorschläge nachlädt. Die Geräte funktionieren weiter, sie zeigen nur ein allgemeines Symbol.
