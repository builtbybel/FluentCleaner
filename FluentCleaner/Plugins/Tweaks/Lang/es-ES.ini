; Texto en español de las reglas de ..\WinRules.ini. Damián Roig (España)
; Encabezado de la sección = [Nombre de la regla del catálogo en inglés].
; Name = Título del ajuste en la lista de la página de Ajustes. (Hacer clic para ver en barra inferior la descripción).
; Detail = Descripción de la acción del Ajuste.
; Si falta una entrada, se mantiene el texto en inglés del archivo de reglas.
; Las categorías no aparecen aquí, sino como Where_* en Strings\es-ES\Resources.resw.

; --- Publicidad ---------------------------------------------------------------

[Disable File Explorer Ads]
Name=Desactivar publicidad en el Explorador de archivos
Detail=Desactiva las notificaciones del proveedor de sincronización (anuncios de OneDrive) en la barra de estado del Explorador de archivos.

[Disable Finish Setup Ads]
Name=Desactivar publicidad en la finalización de la configuración
Detail=Impide que Windows muestre mensajes de configuración y publicidad después de crear el perfil de usuario.

[Disable Lock Screen Ads]
Name=Desactivar publicidad en la pantalla de bloqueo
Detail=Elimina la publicidad de Windows Spotlight y la superposición de la pantalla de bloqueo.

[Disable Personalized Ads]
Name=Desactivar publicidad personalizada
Detail=Desactiva el identificador publicitario que se utiliza para mostrar anuncios personalizados en las aplicaciones.

[Disable Settings App Ads]
Name=Desactivar publicidad en la Configuración
Detail=Elimina la cuenta de Microsoft, Office y las sugerencias de aplicaciones de la sección Configuración.

[Disable Start Menu Ads]
Name=Desactivar publicidad en el menú Inicio
Detail=Elimina las recomendaciones de aplicaciones y la publicidad del menú Inicio (Windows 11).

[Disable Tailored Experiences]
Name=Desactivar experiencias personalizadas
Detail=Impide que Microsoft utilice datos de diagnóstico para mostrar consejos, publicidad y recomendaciones personalizadas.

[Disable Tips and Suggestions]
Name=Desactivar consejos y sugerencias
Detail=Desactiva los consejos y sugerencias de Windows que aparecen en la pantalla de bloqueo y en las notificaciones.

[Disable Welcome Experience Ads]
Name=Desactivar publicidad en la experiencia de bienvenida
Detail=Oculta la sección "Novedades" y la experiencia de bienvenida tras las actualizaciones de Windows.

; --- IA -----------------------------------------------------------------------

[Disable AI Service Autostart]
Name=Desactivar el inicio automático del servicio de IA
Detail=Configura el servicio Windows AI Fabric para que se inicie bajo demanda en vez de al iniciar Windows. Las funciones que lo necesitan seguirán iniciándolo, pero ya no ocuparán memoria desde el arranque.

[Disable Chrome AI Features]
Name=Desactivar la función de IA de Chrome
Detail=Desactiva las funciones de Gemini de Google Chrome mediante las políticas documentadas por Google, incluyendo el modelo local, la búsqueda en el historial y las entradas de IA en la barra de direcciones.

[Disable Click To Do]
Name=Desactivar Click To Do
Detail=Desactiva la ventana superpuesta Click To Do, que ofrece acciones de IA sobre lo que haya en pantalla al mantener pulsada la tecla Windows y hacer clic. La selección y el copiado funcionan como antes.

[Disable Copilot on Taskbar]
Name=Desactivar Copilot en la barra de tareas
Detail=Elimina el botón de Copilot de la barra de tareas mediante una directiva.

[Disable Edge AI Features]
Name=Desactivar las funciones de IA de Edge
Detail=Desactiva las funciones de Copilot en Microsoft Edge, incluyendo el contenido de la página que el navegador enviaría al asistente, el icono de chat de Copilot, la búsqueda en el historial de IA y el modelo de lenguaje local.

[Disable Notepad AI Features]
Name=Desactivar las funciones de IA del Bloc de notas
Detail=Elimina las entradas de Copilot del Bloc de notas, de modo que las funciones Reescribir y Resumir ya no envían el texto a ninguna parte.

[Disable Paint AI Features]
Name=Desactivar las funciones de IA de Paint
Detail=Elimina de Paint las funciones Cocreador, Creador de imágenes, Relleno generativo, Borrado generativo y Eliminar fondo. El resto de funciones permanecen sin cambios.

[Disable Recall]
Name=Desactivar Recall
Detail=Mantiene la función Recall desactivada en un Copilot+ PC. Recall captura una imagen de la pantalla cada pocos segundos y permite realizar búsquedas en ella. Esto impide tanto su activación como el posterior análisis.

[Disable Search Box Suggestions]
Name=Desactivar sugerencias en el cuadro de búsqueda
Detail=Desactiva las sugerencias basadas en la web en el cuadro de búsqueda del menú Inicio para proteger la privacidad.

; --- Edge ---------------------------------------------------------------------

[Disable Edge Browser Sign-in]
Name=Desactivar el inicio de sesión en el navegador Edge
Detail=Impide que Microsoft Edge solicite a los usuarios que inicien sesión con una cuenta de Microsoft.

[Disable Edge Default Top Sites]
Name=Desactivar los sitios recomendados predeterminados de Edge
Detail=Oculta los accesos directos a los sitios recomendados predeterminados (p. ej., MSN, Office) en la página de nueva pestaña de Edge.

[Disable Edge Default Browser Prompt]
Name=Desactivar el mensaje de Edge para establecerlo como navegador predeterminado
Detail=Evita que Edge solicite a los usuarios que lo establezcan como navegador predeterminado.

[Disable Edge Collections]
Name=Desactivar las colecciones de Edge
Detail=Desactiva la función Colecciones en Microsoft Edge.

[Disable Edge Shopping Assistant]
Name=Desactivar el asistente de compras de Edge
Detail=Desactiva la barra lateral de comparación de precios y el asistente de compras en Edge.

[Disable Edge First Run Experience]
Name=Desactivar la experiencia de primera ejecución de Edge
Detail=Omite la página de bienvenida o de primera ejecución que aparece tras una nueva instalación o actualización de Edge.

[Disable Edge Gamer Mode]
Name=Desactivar el modo para jugadores de Edge
Detail=Desactiva la función Modo para jugadores en Microsoft Edge.

[Disable Edge Hubs Sidebar]
Name=Desactivar la barra lateral de Hubs de Edge
Detail=Elimina la barra lateral de Hubs (Descubrir, Herramientas, etc.) de Microsoft Edge.

[Disable Edge Import on Launch]
Name=Desactivar la importación de Edge al iniciarse
Detail=Evita que Edge muestre el cuadro de diálogo de importación de datos cada vez que se inicia.

[Disable Edge Startup Boost]
Name=Desactivar la aceleración de inicio de Edge
Detail=Desactiva la aceleración de inicio de Edge para evitar que Edge siga ejecutándose en segundo plano después de cerrarlo.

[Disable Edge New Tab Quick Links]
Name=Desactivar los enlaces rápidos en nueva pestaña de Edge
Detail=Oculta los accesos directos de los enlaces rápidos en la página de nueva pestaña de Edge.

[Disable Edge User Feedback]
Name=Desactivar los comentarios de usuario de Edge
Detail=Impide que los usuarios envíen comentarios a Microsoft desde Edge.

; --- Explorador de archivos ---------------------------------------------------

[Hide Drive Letters]
Name=Ocultar letras de unidad
Detail=Muestra los nombres de las unidades sin la letra delante, por lo que en 'Este equipo' se muestra 'Windows' en lugar de 'Windows (C:)'. Las letras siguen funcionando al introducir una ruta.

[Hide Duplicate Removable Drives]
Name=Ocultar unidades extraíbles duplicadas
Detail=Elimina la segunda entrada que aparece para una memoria USB en el panel de navegación, donde ya figura bajo 'Este equipo'.

[Hide Gallery from Navigation Pane]
Name=Ocultar Galería del panel de navegación
Detail=Elimina la entrada Galería del panel de navegación. Las fotos permanecen en su sitio.

[Hide Home from Navigation Pane]
Name=Ocultar Inicio del panel de navegación
Detail=Elimina la entrada Inicio del panel de navegación, aquella que muestra los archivos recientes y recomendados.

[Hide OneDrive from Navigation Pane]
Name=Ocultar OneDrive del panel de navegación
Detail=Elimina la entrada OneDrive del panel de navegación. No se desvincula ni se elimina nada, solo deja de aparecer fijada allí.

[Open File Explorer in This PC]
Name=Abrir el Explorador de archivos en 'Este equipo'
Detail=Abre el Explorador de archivos en 'Este equipo' en lugar de Inicio, de modo que las unidades aparezcan en primer lugar.

[Remove Give Access To from Context Menu]
Name=Eliminar 'Conceder acceso a' del menú contextual
Detail=Elimina el submenú de uso compartido del menú contextual de archivos, carpetas y unidades. La función de uso compartido sigue funcionando a través del cuadro de diálogo Propiedades.

[Remove Include in Library from Context Menu]
Name=Eliminar 'Incluir en biblioteca' del menú contextual
Detail=Elimina la opción de bibliotecas del menú contextual de las carpetas. Las bibliotecas continúan estando disponibles.

[Show File Extensions]
Name=Mostrar extensiones de archivo
Detail=Muestra la extensión de tipo de archivo al final de cada nombre, lo que permite reconocer que un archivo llamado "factura.pdf.exe" es un programa.

[Show Hidden Files and Folders]
Name=Mostrar archivos y carpetas ocultos
Detail=Muestra los archivos y carpetas que Windows mantiene ocultos. Los archivos del sistema permanecen ocultos, estos tienen su propia opción de configuración.

; --- Juegos -------------------------------------------------------------------

[Disable Game Bar]
Name=Desactivar la barra de juegos
Detail=Evita que se abra la superposición de la barra de juegos al pulsar Win+G y el saludo de bienvenida al iniciar un juego. El Modo Juego no se ve afectado.

[Disable Game DVR]
Name=Desactivar Game DVR
Detail=Desactiva la grabación en segundo plano de Xbox Game DVR, cuyo uso puede reducir el rendimiento del juego y el uso de la CPU.

[Disable Power Throttling]
Name=Desactivar limitación de potencia
Detail=Desactiva la limitación de potencia para que la CPU funcione a plena velocidad en todos los procesos para mejorar el rendimiento.

[Optimize Visual Effects for Performance]
Name=Optimizar efectos visuales para mejorar el rendimiento
Detail=Desactiva las animaciones de las ventanas, de la barra de tareas y de Peek, así como las del contenido de las ventanas al arrastrarlas. El cuadro de diálogo 'Opciones de rendimiento' muestra entonces la opción Personalizado, precisamente porque eso es lo que es.

; --- Privacidad ---------------------------------------------------------------

[Disable Activity History]
Name=Desactivar el historial de actividades
Detail=Impide que Windows registre actividades (aplicaciones abiertas, archivos utilizados) para la función Línea de tiempo.

[Disable App Launch Tracking]
Name=Desactivar el seguimiento del inicio de aplicaciones
Detail=Impide que Windows realice un seguimiento de las aplicaciones iniciadas para ofrecer sugerencias personalizadas en el menú Inicio.

[Reduce Diagnostic Data]
Name=Reducir los datos de diagnóstico
Detail=Limita al nivel mínimo permitido los datos de diagnóstico y telemetría de Windows enviados a Microsoft.

[Disable Find My Device]
Name=Desactivar 'Encontrar mi dispositivo'
Detail=Impide que Windows informe de la ubicación del dispositivo para que pueda localizarse desde una cuenta de Microsoft. Esta opción elimina la posibilidad de localizar un portátil robado.

[Disable Location Tracking]
Name=Desactivar el seguimiento de la ubicación
Detail=Desactiva el servicio de ubicación de Windows para todas las aplicaciones del dispositivo.

[Disable Lock Screen Slideshow]
Name=Desactivar la presentación de diapositivas de la pantalla de bloqueo
Detail=Desactiva la presentación de diapositivas de la pantalla de bloqueo, ya que puede utilizar fotos personales.

[Disable Narrator Online Services]
Name=Desactivar los servicios en línea de Narrador
Detail=Impide que el Narrador de Windows envíe datos a los servicios en línea de Microsoft.

[Disable Notification Banners]
Name=Desactivar los banners de notificación
Detail=Silencia los banners emergentes de las aplicaciones y del propio Windows. El centro de notificaciones sigue recopilándolos, por lo que no se pierde nada, simplemente evita las interrupciones.

[Disable Online Speech Recognition]
Name=Desactivar el reconocimiento de voz en línea
Detail=Desactiva el reconocimiento de voz basado en la nube y la personalización de la entrada de datos.

[Disable Silent App Installation]
Name=Desactivar la instalación silenciosa de aplicaciones
Detail=Impide que Windows instale de forma silenciosa las aplicaciones sugeridas en segundo plano.

[Disable Windows Spotlight Lock Screen]
Name=Desactivar la pantalla de bloqueo de Windows Spotlight
Detail=Desactiva Windows Spotlight, la función que muestra imágenes seleccionadas por Microsoft y consejos en la pantalla de bloqueo.

; --- Sistema ------------------------------------------------------------------

[Show BSOD Details]
Name=Mostrar detalles de la pantalla azul de la muerte (BSOD)
Detail=Muestra detalles técnicos (código de error, parámetros) en la pantalla azul de la muerte en lugar del emoticono sonriente.

[Enable Long Paths]
Name=Habilitar rutas largas
Detail=Elimina el límite de 260 caracteres en las rutas de acceso para los programas cuyo manifiesto declare compatibilidad con rutas largas. Los programas leen el valor una sola vez al iniciarse, por lo que solo un reinicio hace que se aplique de forma generalizada.

[Disable Hibernation]
Name=Desactivar hibernación
Detail=Desactiva la hibernación, lo que elimina el archivo hiberfil.sys y libera una cantidad de espacio en disco equivalente a la memoria RAM instalada. El Inicio rápido utiliza ese mismo archivo y también se desactiva, por lo que el próximo arranque será completo y puede tardar un poco más.

[Reduce Menu Show Delay]
Name=Reducir el retraso de visualización de los menús
Detail=Establece una demora de 10 ms al pasar el cursor por los submenús. El valor predeterminado de Windows es de 400 ms. Si el valor actual ya es inferior a 10 ms, al aplicar este ajuste se incrementará.

[Disable Network Throttling]
Name=Desactivar la limitación de red
Detail=Elimina la limitación de red multimedia de Windows, ya que puede reducir el rendimiento de la red para las tareas que se ejecutan en segundo plano.

[Speed Up Shutdown]
Name=Acelerar el apagado
Detail=Reduce de 5000 ms a 1000 ms el tiempo que Windows espera a que se detengan los servicios al apagar el equipo.

[Optimize Multimedia CPU Priority]
Name=Optimizar la prioridad de la CPU para multimedia
Detail=Reserva el 10% del tiempo de la CPU para tareas en segundo plano, en lugar del 20% predeterminado por Windows, lo que proporciona más margen a los juegos y al contenido multimedia. Si el valor actual ya es inferior a 10, al aplicar esta opción se reducirá la prioridad.

[Show Verbose Status Messages]
Name=Mostrar mensajes de estado detallados
Detail=Muestra mensajes detallados sobre el estado del arranque y el apagado, en lugar de la pantalla genérica "Por favor, espere...".

[Disable Automatic Device Encryption]
Name=Desactivar el cifrado automático del dispositivo
Detail=Impide que Windows active automáticamente el cifrado del dispositivo durante la configuración o al iniciar sesión por primera vez con una cuenta de Microsoft. Una unidad que ya esté cifrada seguirá estándolo, pero podrá descifrarse manualmente en caso que se necesite.

[Disable Enhance Pointer Precision]
Name=Desactivar la precisión mejorada del puntero
Detail=Desactiva la aceleración del ratón para que el mismo movimiento de la mano siempre recorra la misma distancia en pantalla. Los tres valores forman parte de la misma configuración y Windows los lee al iniciar sesión.

[Disable Sticky Keys Shortcut]
Name=Desactivar el atajo de teclas especiales (Sticky Keys)
Detail=Impide que al pulsar cinco veces la tecla Mayús se activen las teclas especiales, el aviso que interrumpe los juegos y la escritura. La función de teclas especiales seguirá estando disponible en la configuración de accesibilidad.

[Disable Storage Sense]
Name=Desactivar el sensor de almacenamiento
Detail=Impide que el sensor de almacenamiento vacíe la papelera de reciclaje y la carpeta Descargas según su propio calendario. Esto se configura como una directiva, por lo que la opción del sensor en Configuración aparecerá desactivada a partir de ese momento.

; --- Barra de tareas ----------------------------------------------------------

[Align Taskbar Left]
Name=Alinear la barra de tareas a la izquierda
Detail=Vuelve a colocar los iconos de la barra de tareas en el borde izquierdo, donde se encontraban hasta Windows 10. El perfil predeterminado no incluye ningún valor para esta opción, por lo que al restablecerlo se elimina y se deja que Windows decida.

[Always Show All Tray Icons]
Name=Mostrar siempre todos los iconos de la bandejar
Detail=Muestra todos los iconos del área de notificación en lugar de ocultarlos detrás de la flecha ^. (Solo Windows 10)

[Disable News and Interests]
Name=Desactivar noticias e intereses
Detail=Elimina el widget de tiempo y noticias de la barra de tareas de Windows 10. (Solo Windows 10)

[Remove Meet Now Button]
Name=Eliminar el botón 'Reunirse ahora'
Detail=Oculta el botón 'Reunirse ahora' (videollamada) de la bandeja del sistema. (Solo Windows 10)

[Hide Search from Taskbar]
Name=Ocultar la búsqueda de la barra de tareas
Detail=Elimina por completo la búsqueda de la barra de tareas, tanto el campo de búsqueda como el icono. La búsqueda sigue abriéndose desde el menú Inicio o con Win+S.

[Show Search Icon Only]
Name=Mostrar solo el icono de búsqueda
Detail=Reduce el campo de búsqueda a un único icono, lo que devuelve el ancho a la barra de tareas sin ocultar la búsqueda por completo.

[Hide Task View Button]
Name=Ocultar el botón 'Vista de tareas'
Detail=Elimina el botón 'Vista de tareas' de la barra de tareas.

[Enable End Task on Taskbar]
Name=Habilitar 'Finalizar tarea' en la barra de tareas
Detail=Agrega la opción 'Finalizar tarea' al menú contextual de la barra de tareas para poder terminar procesos rápidamente. (Solo Windows 11)

[Use Small Taskbar Icons]
Name=Utilizar iconos pequeños en la barra de tareas
Detail=Reduce el tamaño de los iconos de la barra de tareas para que esta resulte más compacta. (Solo Windows 10)

[Return to Last Active Window on Click]
Name=Volver a la última ventana activa al hacer clic
Detail=Al hacer clic en un botón agrupado de la barra de tareas, se recupera la última ventana utilizada en lugar de abrirse la fila de miniaturas. Al pasar el cursor por encima, se siguen mostrando todas las ventanas del grupo.

; --- Apariencia ---------------------------------------------------------------

[Disable Bing Search in Start Menu]
Name=Desactivar la búsqueda de Bing en el menú de Inicio
Detail=Impide que el menú de Inicio envíe las consultas de búsqueda escritas a Bing o a Internet.

[Enable Dark Mode]
Name=Activar modo oscuro
Detail=Cambia Windows y sus aplicaciones al esquema de color oscuro. El tema predeterminado de fábrica establece ambos en claro, que es lo que se restablece al reiniciar.

[Enable Classic Context Menus]
Name=Activar menú contextual clásico
Detail=Restaura el menú contextual completo de Windows 10 al hacer clic con el botón derecho en Windows 11. (Solo Windows 11)

[Disable Lock Screen]
Name=Desactivar pantalla de bloqueo
Detail=Omite la pantalla de bloqueo y pasa directamente a la pantalla de inicio de sesión al reactivarse.

[Show Most Used Apps in Start Menu]
Name=Mostrar las aplicaciones más usadas en el menú Inicio
Detail=Obliga a que la lista de aplicaciones más usadas del menú Inicio permanezca visible. La directiva toma el valor 1 para mostrarla y 2 para ocultarla. Si no se configura, la opción en Configuración determina el comportamiento.

[Disable Snap Layouts When Dragging]
Name=Desactivar diseños de acoplamiento al arrastrar
Detail=Evita que la barra de diseños se despliegue al arrastrar una ventana hasta el borde superior de la pantalla. El arrastre hacía las esquinas sigue acoplando ventanas.

[Disable Snap Suggestions]
Name=Desactivar sugerencias de acoplamiento
Detail=Tras acoplar una ventana, Windows sugiere dónde colocar las ventanas restantes en la mitad libre de la pantalla. Esta opción desactiva esa sugerencia. Los diseños que emergen al pasar el cursor por el botón de maximizar se configuran por separado.

[Disable Snap Assist Flyout]
Name=Desactivar menú desplegable de ayuda de acoplamiento
Detail=Desactiva el menú desplegable de diseños de acoplamiento que emerge al pasar el cursor por el botón de maximizar.

[Hide Edge Tabs in Alt Tab]
Name=Ocultar pestañas de Edge en Alt+Tab
Detail=Mantiene el uso de Alt+Tab para abrir ventanas, pero excluye las pestañas del navegador, de modo que el selector ya no se llena de miniaturas de ventana.

[Disable Transparency Effects]
Name=Desactivar efectos de transparencia
Detail=Desactiva el efecto translúcido de la barra de tareas, el menú Inicio y los fondos de ventanas. Las superficies pasan a ser opacas, lo que en sistemas con gráficos de bajo rendimiento supone un alivio para el motor de renderizado.

[Hide Settings Home Page]
Name=Ocultar la página de inicio en Configuración
Detail=Elimina la página de inicio de Configuración, por lo que esta se abre en Sistema y no muestra tarjetas de recomendaciones. Este valor es una lista de páginas, y al aplicarlo se sustituye el contenido que hubiera anteriormente en la lista.

[Set Start Menu to More Pins Layout]
Name=Establecer el menú Inicio en el diseño Más aplicaciones ancladas
Detail=Establece el menú Inicio de Windows 11 para que muestre más aplicaciones ancladas y menos recomendaciones.

[Disable Start Menu Phone Companion]
Name=Desactivar el panel complementario del teléfono en el menú Inicio
Detail=Oculta el panel complementario del teléfono que Windows 11 abre en la parte derecha del menú Inicio. El resultado es el mismo que el del interruptor situado en Configuración > Personalización > Inicio > Otros...

; --- Actualizaciones ----------------------------------------------------------

[Keep Update Pause Available]
Name=Mantener disponible la pausa de actualizaciones
Detail=Aumenta el límite de pausa para que Configuración ofrezca períodos prolongados de "pausa de actualizaciones" en lugar de solo una semana.

[Never Restart While Signed In]
Name=No reiniciar nunca mientras haya sesión iniciada
Detail=Impide que Windows se reinicie por sí solo para completar una actualización mientras haya alguna sesión iniciada.

[Download Updates But Ask Before Installing]
Name=Descargar actualizaciones preguntando antes de instalarlas
Detail=Sigue descargando actualizaciones, pero espera a que el usuario haga clic para instalarlas, en lugar de instalarlas según su propio calendario.

[Do Not Include Drivers in Updates]
Name=No incluir controladores en las actualizaciones
Detail=Excluye las actualizaciones de controladores de Windows Update, para que no se sustituya un controlador que funciona sin que el usuario tenga conocimiento de ello.

[Do Not Restart Devices Automatically]
Name=No reiniciar dispositivos automáticamente
Detail=Bloquea el reinicio automático que Windows programa tras una actualización fuera de las horas activas.

[Do Not Install Updates Early]
Name=No instalar actualizaciones tempranas
Detail=Desactiva la opción "obtener las últimas actualizaciones tan pronto como estén disponibles", de modo que el equipo espere al lanzamiento regular en lugar de recibir la primera entrega.

[Download Updates Only From Microsoft]
Name=Descargar actualizaciones solo de Microsoft
Detail=Configura la optimización de la entrega para que se realice únicamente a través de los servidores de Microsoft, de modo que el equipo no descargue ni envíe partes de las actualizaciones a otros equipos.

[Do Not Download Device Icons and Info]
Name=No descargar iconos e información del dispositivo
Detail=Impide que Windows recupere iconos, nombres y sugerencias de aplicaciones para el hardware recién conectado. Los dispositivos siguen funcionando, pero muestran un icono genérico.