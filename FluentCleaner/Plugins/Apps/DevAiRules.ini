DetectFile1=%AppData%\Antigravity
DetectFile2=%UserProfile%\.gemini\antigravity
FileKey1=%AppData%\Antigravity\blob_storage|*|REMOVESELF
FileKey2=%AppData%\Antigravity\Cache|*|REMOVESELF
FileKey3=%AppData%\Antigravity\CachedData|*|REMOVESELF
FileKey4=%AppData%\Antigravity\CachedExtensionVSIXs|*|REMOVESELF
FileKey5=%AppData%\Antigravity\Code Cache|*|REMOVESELF
FileKey6=%AppData%\Antigravity\DawnGraphiteCache|*|REMOVESELF
FileKey7=%AppData%\Antigravity\DawnWebGPUCache|*|REMOVESELF
FileKey8=%AppData%\Antigravity\GPUCache|*|REMOVESELF
FileKey9=%AppData%\Antigravity\Crashpad|*|REMOVESELF
FileKey10=%AppData%\Antigravity\logs|*|REMOVESELF
FileKey11=%UserProfile%\.gemini\antigravity\cache|*|REMOVESELF
FileKey12=%UserProfile%\.gemini\antigravity\crashes|*|REMOVESELF
FileKey13=%UserProfile%\.gemini\antigravity\log|*|REMOVESELF
FileKey14=%UserProfile%\.gemini\antigravity\scratch|*|REMOVESELF
FileKey15=%UserProfile%\.gemini\antigravity|cli.log;*.log

[Antigravity Local History *]
Section=Developer Tools
