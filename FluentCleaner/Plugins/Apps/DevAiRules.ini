; ==============================================================================
; FluentCleaner - Developer & AI Coding Tool Cleaner Pack (DevAiRules)
; Clean rules for modern AI coding assistants, IDEs, and developer caches.
; ==============================================================================

[Claude Code *]
Section=Developer Tools
DetectFile=%UserProfile%\.claude
FileKey1=%UserProfile%\.claude\cache|*|REMOVESELF
FileKey2=%UserProfile%\.claude\downloads|*|REMOVESELF
FileKey3=%UserProfile%\.claude\plugins\cache|*|REMOVESELF
FileKey4=%UserProfile%\.claude\plugins\marketplaces|*|REMOVESELF
FileKey5=%UserProfile%\.claude\debug|*|REMOVESELF
FileKey6=%UserProfile%\.claude\logs|*|REMOVESELF
FileKey7=%UserProfile%\.claude|*.log;*.tmp;*.temp
FileKey8=%UserProfile%\.claude\shell-snapshots|*|REMOVESELF

[Claude Code History *]
Section=Developer Tools
DetectFile=%UserProfile%\.claude
Default=False
Warning=Deletes checkpoint restore file history and session conversations. You will lose /restore and session resume.
FileKey1=%UserProfile%\.claude\file-history|*|REMOVESELF
FileKey2=%UserProfile%\.claude\sessions|*|REMOVESELF
FileKey3=%UserProfile%\.claude\session-env|*|REMOVESELF
FileKey4=%UserProfile%\.claude|history.jsonl

