; ==============================================================================
; Winapp2 entry format — annotated example for FluentCleaner
; ==============================================================================
; Lines starting with ; are comments and are ignored by the parser.
; Entries start with a [Name] header and end where the next one begins.
; The trailing " *" in the name marks it as a community entry — FluentCleaner
; strips it from the display name automatically.
; ==============================================================================


[My Example App *]

; ---------------------------------------------------------------------------
; CATEGORY
; Either LangSecRef (numeric code) or Section (free text), not both.
; LangSecRef maps to a known category — 3021 is "Applications", 3025 is
; "Windows", 3026 is "Internet". Section is a fallback for anything custom.
; ---------------------------------------------------------------------------
LangSecRef=3021
; Section=My Custom Category


; ---------------------------------------------------------------------------
; DEFAULT
; Whether this entry is checked by default in the UI.
; Omitting it is the same as Default=True.
; Set False for anything that touches passwords, cookies, or saved data —
; users should opt in to those consciously.
; ---------------------------------------------------------------------------
Default=True


; ---------------------------------------------------------------------------
; WARNING
; Shown as a tooltip in the UI. Use it when cleaning something could actually
; hurt the user. Saved passwords, bookmarks, active sessions — that kind of thing.
; Skip it for plain temp files, nobody needs a warning for *.tmp.
; ---------------------------------------------------------------------------
Warning=Removes saved login data. Make sure you know your passwords first.


; ---------------------------------------------------------------------------
; DETECTION — the entry only shows up if at least one of these passes.
; You can mix Detect and DetectFile freely; any one hit is enough (OR logic).
;
; Detect  — checks a registry key. The key just needs to exist; value doesn't matter.
; Detect1, Detect2, ... — same thing, just multiple keys.
;
; DetectFile — checks whether a file or folder exists on disk.
; DetectFile1, DetectFile2, ... — same, multiple paths.
;
; SpecialDetect — named shortcut for well-known apps:
;   DET_CHROME, DET_FIREFOX, DET_EDGE, DET_OPERA, DET_SAFARI, DET_THUNDERBIRD
;   Use this instead of a manual Detect when targeting those browsers.
; ---------------------------------------------------------------------------
Detect=HKCU\Software\MyApp
Detect1=HKLM\Software\MyApp
DetectFile=%ProgramFiles%\MyApp\myapp.exe
DetectFile1=%LocalAppData%\MyApp
; SpecialDetect=DET_CHROME


; ---------------------------------------------------------------------------
; FILEKEY — what to delete on disk.
; Format:  FileKeyN=<path>|<pattern>[|RECURSE or REMOVESELF]
;
; <path>     folder to scan. Supports %EnvVars% and * wildcards in segments.
; <pattern>  file filter. Multiple filters separated by semicolons: *.log;*.tmp
;            Leave out the pipe entirely and it defaults to *.* (everything).
;
; No flag    — top-level files only, subdirectories are not touched.
; RECURSE    — scan all subdirectories too, but leave empty folders behind.
; REMOVESELF — same as RECURSE, but also prunes empty directories afterwards.
;              The scanned folder itself is removed if it ends up empty.
;
; Common env vars: %AppData%, %LocalAppData%, %Temp%, %ProgramFiles%,
;                  %ProgramFiles(x86)%, %WinDir%, %UserProfile%
; ---------------------------------------------------------------------------

; top-level *.log files only
FileKey1=%LocalAppData%\MyApp\Logs|*.log

; multiple patterns in one key
FileKey2=%LocalAppData%\MyApp\Cache|*.tmp;*.bak

; recurse into subdirectories, keep the folder structure
FileKey3=%LocalAppData%\MyApp\Temp|*.*|RECURSE

; recurse and remove empty dirs when done
; good for cache folders that should disappear entirely when clean
FileKey4=%LocalAppData%\MyApp\OldCache|REMOVESELF

; wildcard in the path — matches all profile folders under Firefox
FileKey5=%AppData%\Mozilla\Firefox\Profiles\*\cache2\entries|*.*|REMOVESELF

; no pattern at all — deletes everything in the folder, top-level only
FileKey6=%Temp%\MyApp


; ---------------------------------------------------------------------------
; REGKEY — what to delete in the registry.
; Format:  RegKeyN=<HIVE\SubKey>[|ValueName]
;
; Without a ValueName — the entire key and everything under it is deleted.
; With a ValueName    — only that one value is removed, the key stays.
;
; Supported hives: HKCU, HKLM, HKU, HKCC, HKCR
; ---------------------------------------------------------------------------

; delete the entire key tree
RegKey1=HKCU\Software\MyApp\RecentFiles

; delete only a single value, leave the key intact
RegKey2=HKCU\Software\MyApp\Settings|LastOpenedFile


; ---------------------------------------------------------------------------
; EXCLUDEKEY — protect specific files or folders from being deleted,
; even if a FileKey above would match them.
;
; Three types:
;   FILE|<path>\|<filename or pattern>  — protects a file inside a folder.
;                                         Wildcards work: *.db, keep_*.txt
;                                         Exact names work too: places.sqlite
;   PATH|<path>\                        — protects an entire directory subtree.
;                                         Everything under that path is skipped.
;   REG|<registry path>                 — registry exclusion (parsed but not
;                                         used for file scanning).
;
; The path must end with a backslash for FILE and PATH types.
; ---------------------------------------------------------------------------

; protect one specific file inside a folder
ExcludeKey1=FILE|%AppData%\MyApp\|important.db

; protect all files matching a pattern inside a folder
ExcludeKey2=FILE|%LocalAppData%\MyApp\Cache\|*.sqlite

; protect an entire subfolder and everything in it
ExcludeKey3=PATH|%LocalAppData%\MyApp\DoNotTouch\
